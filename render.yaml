services:
  - type: web
    name: aata-v71
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn i_agent_system:app --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 120
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        value: "7106069536"
